        type: object
        description: Erro desta categoria HTTP.
        additionalProperties: false
        required:
          - error
        properties:
          error:
            type: object
            description: Detalhes do erro.
            additionalProperties: false
            required:
              - code
              - message
            properties:
              code:
                type: string
                enum:
                  - SERVICE_UNAVAILABLE

type: object
description: Reserva pertencente à conversa consultada. Não há busca global por nome de paciente.
additionalProperties: false
required:
  - id
  - status
  - startsAt
  - endsAt
  - patient
  - specialty
  - doctor
  - room
  - canCancel
properties:
  id:
    type: string
    description: 'Identificador da reserva. Identificador opaco: use o valor retornado pela API; não
      extraia a chave numérica.'
  status:
    $ref: ../../openapi.yaml#/components/schemas/AppointmentStatus
  startsAt:
    type: string
    format: date-time
    description: Início do horário marcado.
  endsAt:
    type: string
    format: date-time
    description: Fim do horário marcado.
  patient:
    $ref: ../../openapi.yaml#/components/schemas/NamedResource
  specialty:
    $ref: ../../openapi.yaml#/components/schemas/NamedResource
  doctor:
    $ref: ../../openapi.yaml#/components/schemas/NamedResource
  room:
    $ref: ../../openapi.yaml#/components/schemas/NamedResource
  canCancel:
    type: boolean
    description: Verdadeiro somente para reserva pendente de conversa ativa. O servidor revalida ao cancelar.

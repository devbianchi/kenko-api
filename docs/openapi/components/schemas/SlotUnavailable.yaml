type: object
description: Único conflito que também devolve o estado atualizado. A revisão avança, a oferta é
  refeita e o cliente deve usar esta view. Reenvio com a mesma actionId retorna este mesmo 409.
additionalProperties: false
required:
  - error
  - conversation
  - messages
  - view
  - availableActions
  - result
properties:
  error:
    type: object
    description: Erro específico da disputa de horário.
    additionalProperties: false
    required:
      - code
      - message
    properties:
      code:
        type: string
        const: SLOT_UNAVAILABLE
        description: Horário ocupado por outra reserva.
      message:
        type: string
        description: Descrição do conflito.
  conversation:
    $ref: ../../openapi.yaml#/components/schemas/Conversation
  messages:
    type: array
    description: Somente mensagens da ação; replay devolve as mesmas mensagens e ids.
    items:
      $ref: ../../openapi.yaml#/components/schemas/Message
  view:
    $ref: ../../openapi.yaml#/components/schemas/View
  availableActions:
    type: array
    description: Contém exit enquanto a conversa está ativa; lista vazia quando encerrada ou abandonada.
    items:
      type: string
      const: exit
      description: Ação global de saída.
    maxItems: 1
  result:
    type: 'null'
    description: Não houve confirmação nesta ação.

openapi: 3.1.0
info:
  title: Kenko API
  version: 0.1.0
  summary: Atendimento por menus, agendamento e indicadores da clínica Kenko.
  description: >-
    API acadêmica aberta, sem autenticação. O bot determinístico roda no backend, com roteiro no
    banco, e o painel é somente leitura.


    Campos usam camelCase; ids são opacos; datas locais YYYY-MM-DD, meses YYYY-MM, instantes ISO
    8601 com deslocamento. Todas as regras temporais usam America/Sao_Paulo. Intervalos incluem
    início e excluem fim. Percentuais usam escala 0–100 e não são arredondados; durações são
    segundos e medianas podem ter fração. Ausência de base é null; ausência de ocorrências é 0;
    coleções vazias são [].


    GETs não executam ações nem renovam atividade. A transcrição textual fica no navegador; a API
    mantém fatos estruturados. Não há CRUD público de cadastros auxiliares, autenticação,
    remarcação, exportação ou gestão pelo painel.


    Esta especificação descreve o comportamento atual. Não habilita nem desabilita chamadas em um
    visualizador ou página customizada. GET /api/docs entrega o JSON para o frontend; a interface
    controla se oferece execução de chamadas. URLs/métodos não cadastrados recebem 404 ROUTE_NOT_FOUND com envelope error.
    Todas as respostas trazem X-Request-Id.


    O contrato exige um único instante por requisição; há leituras existentes que consultam Clock
    novamente ao montar meta. Essa divergência de implementação não é corrigida pela documentação.
    Exemplos são fictícios e independentes, exceto quando a descrição indicar uma sequência.


    O parser JSON é global: caso um corpo JSON seja enviado a qualquer rota, JSON malformado ou
    corpo excessivo pode gerar INVALID_JSON (400) ou PAYLOAD_TOO_LARGE (413) antes da execução da
    operação. Leituras não exigem corpo.
servers:
  - url: http://localhost:8080
    description:
      Desenvolvimento local. A URL pública será configurada quando o ambiente de hospedagem
      estiver definido; os paths já incluem /api.
security: []
tags:
  - name: Documentação
    description: Especificação OpenAPI em JSON para o frontend e outros visualizadores.
  - name: Saúde
    description: Disponibilidade do processo HTTP; não verifica prontidão do banco.
  - name: Clínica
    description: Cadastro, expediente e especialidades somente para consulta.
  - name: Home
    description: Resumo mensal e próximas consultas futuras.
  - name: Calendário
    description: Contagens por intervalo e detalhes por data marcada.
  - name: Analytics
    description: Indicadores, coortes, distribuição e séries calculados a partir do banco.
  - name: Conversas
    description: Criação idempotente, leitura de estado e reservas vinculadas ao contato.
  - name: Bot
    description: Ações transacionais do atendimento por menus, com revisão e idempotência.
